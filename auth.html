<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Lexora — Authentication</title>

  <!-- =====================================================
       CLERK
       ===================================================== -->

  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_d2FybS1zcG9uZ2UtOTguY2xlcmsuYWNjb3VudHMuZGV2JA"
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #07080b;
      color: #f5f5f5;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      min-height: 100vh;

      display: grid;
      place-items: center;

      padding: 24px;

      overflow-x: hidden;
    }


    /* =====================================================
       BACKGROUND
       ===================================================== */

    .background {
      position: fixed;
      inset: 0;

      pointer-events: none;

      background:
        radial-gradient(
          700px 500px at 50% 0%,
          rgba(100,110,255,.12),
          transparent 70%
        );
    }


    .grid {
      position: fixed;
      inset: 0;

      pointer-events: none;

      opacity: .16;

      background-image:
        linear-gradient(
          rgba(255,255,255,.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.025) 1px,
          transparent 1px
        );

      background-size:
        50px 50px;
    }


    /* =====================================================
       PAGE
       ===================================================== */

    .page {
      position: relative;
      z-index: 10;

      width: min(
        100%,
        460px
      );
    }


    /* =====================================================
       BRAND
       ===================================================== */

    .brand {
      text-align: center;

      margin-bottom: 28px;
    }

    .brand-name {
      font-size: 29px;

      font-weight: 850;

      letter-spacing: -.065em;
    }

    .brand-subtitle {
      margin-top: 8px;

      color: #656873;

      font-size: 10px;

      letter-spacing: .13em;

      font-family: monospace;
    }


    /* =====================================================
       AUTH CARD
       ===================================================== */

    .auth-card {
      position: relative;
      z-index: 20;

      width: 100%;

      min-height: 500px;

      padding: 10px;

      border:
        1px solid rgba(255,255,255,.09);

      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          rgba(21,22,28,.97),
          rgba(9,10,13,.98)
        );

      box-shadow:
        0 35px 100px
        rgba(0,0,0,.5);

      overflow: visible;
    }


    /* =====================================================
       CLERK MOUNT
       ===================================================== */

    #clerk-auth {
      position: relative;
      z-index: 100;

      width: 100%;

      pointer-events: auto;
    }


    #clerk-auth * {
      pointer-events: auto;
    }


    /* =====================================================
       LOADING
       ===================================================== */

    .loading {
      min-height: 480px;

      display: grid;

      place-items: center;

      text-align: center;
    }

    .loading-inner {
      display: flex;

      flex-direction: column;

      align-items: center;
    }

    .spinner {
      width: 28px;
      height: 28px;

      border:
        2px solid
        rgba(255,255,255,.12);

      border-top-color:
        #ffffff;

      border-radius: 50%;

      animation:
        spin .8s linear infinite;

      margin-bottom: 14px;
    }

    @keyframes spin {

      to {
        transform:
          rotate(360deg);
      }

    }

    .loading-title {
      color: #aaaeb7;

      font-size: 11px;

      font-weight: 600;
    }

    .loading-subtitle {
      margin-top: 6px;

      color: #50535b;

      font-family: monospace;

      font-size: 8px;

      letter-spacing: .1em;
    }


    /* =====================================================
       ERROR
       ===================================================== */

    .error {
      display: none;

      margin: 12px;

      padding: 14px;

      border:
        1px solid
        rgba(255,90,90,.2);

      border-radius: 10px;

      background:
        rgba(255,70,70,.05);

      color: #ff9c9c;

      font-size: 11px;

      line-height: 1.6;
    }


    /* =====================================================
       FOOTER
       ===================================================== */

    .back {
      display: block;

      margin-top: 20px;

      text-align: center;

      color: #5c6069;

      font-size: 10px;

      text-decoration: none;

      transition:
        color .2s ease;
    }

    .back:hover {
      color: #ffffff;
    }


    /* =====================================================
       CLERK OVERRIDES
       ===================================================== */

    .cl-rootBox,
    .cl-card {
      width: 100% !important;
    }

    .cl-card {
      background:
        transparent !important;

      box-shadow:
        none !important;

      border:
        0 !important;
    }

    .cl-formButtonPrimary {
      cursor: pointer !important;
    }

    .cl-formFieldInput {
      cursor: text !important;
    }

    .cl-userButtonPopoverCard {
      z-index: 999999 !important;
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 520px) {

      body {
        padding: 14px;
      }

      .brand-name {
        font-size: 25px;
      }

      .auth-card {
        border-radius: 16px;
      }

    }

  </style>

</head>


<body>

  <div class="background"></div>

  <div class="grid"></div>


  <main class="page">


    <header class="brand">

      <div class="brand-name">
        LEXORA
      </div>

      <div class="brand-subtitle">
        LANGUAGE INTELLIGENCE INFRASTRUCTURE
      </div>

    </header>


    <section class="auth-card">


      <!-- ===================================================
           LOADING
           =================================================== -->

      <div
        id="loading"
        class="loading"
      >

        <div class="loading-inner">

          <div class="spinner"></div>

          <div class="loading-title">
            Connecting to Clerk
          </div>

          <div class="loading-subtitle">
            INITIALIZING AUTHENTICATION
          </div>

        </div>

      </div>


      <!-- ===================================================
           ERROR
           =================================================== -->

      <div
        id="error"
        class="error"
      ></div>


      <!-- ===================================================
           CLERK
           =================================================== -->

      <div
        id="clerk-auth"
        style="display:none;"
      ></div>


    </section>


    <a
      href="/"
      class="back"
    >
      ← Back to Lexora
    </a>


  </main>


  <script>

    /* =======================================================
       CLERK BOOT
       ======================================================= */

    async function bootClerk() {

      const loading =
        document.getElementById(
          "loading"
        );

      const auth =
        document.getElementById(
          "clerk-auth"
        );

      const error =
        document.getElementById(
          "error"
        );


      try {


        /* ---------------------------------------------------
           WAIT FOR CLERK SCRIPT
           --------------------------------------------------- */

        let attempts = 0;

        while (
          !window.Clerk &&
          attempts < 120
        ) {

          await new Promise(
            resolve =>
              setTimeout(
                resolve,
                100
              )
          );

          attempts++;

        }


        if (!window.Clerk) {

          throw new Error(
            "Clerk JavaScript did not load. Check the publishable key, internet connection, and browser console."
          );

        }


        /* ---------------------------------------------------
           LOAD CLERK
           --------------------------------------------------- */

        await window.Clerk.load();


        /* ---------------------------------------------------
           ALREADY AUTHENTICATED
           --------------------------------------------------- */

        if (window.Clerk.user) {

          window.location.replace(
            "/dashboard.html"
          );

          return;

        }


        /* ---------------------------------------------------
           HIDE LOADING
           --------------------------------------------------- */

        loading.style.display =
          "none";

        auth.style.display =
          "block";


        /* ---------------------------------------------------
           MOUNT SIGN IN
           --------------------------------------------------- */

        await window.Clerk.mountSignIn(
          auth,
          {

            routing:
              "hash",

            appearance: {

              variables: {

                colorBackground:
                  "#111217",

                colorText:
                  "#f5f5f5",

                colorTextSecondary:
                  "#858993",

                colorPrimary:
                  "#ffffff",

                colorInputBackground:
                  "#0b0c10",

                colorInputText:
                  "#ffffff",

                colorDanger:
                  "#ff7777",

                borderRadius:
                  "10px"

              },

              elements: {

                card: {

                  background:
                    "transparent",

                  boxShadow:
                    "none",

                  width:
                    "100%"

                },

                headerTitle: {

                  color:
                    "#ffffff"

                },

                headerSubtitle: {

                  color:
                    "#737780"

                },

                formFieldLabel: {

                  color:
                    "#aeb1b8"

                },

                formFieldInput: {

                  background:
                    "#0b0c10",

                  color:
                    "#ffffff",

                  borderColor:
                    "rgba(255,255,255,.10)"

                },

                formButtonPrimary: {

                  background:
                    "#ffffff",

                  color:
                    "#08090c",

                  cursor:
                    "pointer"

                },

                footerActionLink: {

                  color:
                    "#ffffff"

                }

              }

            },

            signUpUrl:
              "/auth.html#/sign-up",

            afterSignInUrl:
              "/dashboard.html",

            afterSignUpUrl:
              "/dashboard.html"

          }
        );


        /* ---------------------------------------------------
           AUTH STATE LISTENER
           --------------------------------------------------- */

        window.Clerk.addListener(
          ({ user }) => {

            if (user) {

              window.location.replace(
                "/dashboard.html"
              );

            }

          }
        );


      } catch (err) {


        console.error(
          "LEXORA CLERK ERROR:",
          err
        );


        loading.style.display =
          "none";

        error.style.display =
          "block";

        error.textContent =
          err?.message ||
          "Clerk failed to initialize.";

      }

    }


    /* =======================================================
       START
       ======================================================= */

    bootClerk();

  </script>


</body>
</html>
